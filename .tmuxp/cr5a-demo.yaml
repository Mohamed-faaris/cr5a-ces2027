# CR5A demo stack
# Run from the ROS 2 workspace root inside moveit-dev:
#   tmux set-option -g mouse on
#   tmuxp load .tmuxp/cr5a-demo.yaml
#
# Windows:
#   0 MoveIt demo (fake hardware)
#   1 Gazebo simulation
#   2 CR5A API + rosbridge
#   3 Web frontend
#   4 ROS node/topic monitor
#   5 Interactive ROS shell
#
# NOTE: MoveIt's demo.launch.py uses fake hardware. It is started separately
# from Gazebo; this profile does not connect MoveIt controllers to Gazebo.

session_name: cr5a-demo
start_directory: ../../../
windows:
  - window_name: moveit-demo
    focus: true
    panes:
      - shell_command:
          - bash -lc 'bash src/cr5a-ces2027/.tmuxp/log-pane.sh moveit-demo bash -lc "source /opt/ros/humble/setup.bash && source install/setup.bash && exec ros2 launch cr5_moveit demo.launch.py"'

  - window_name: gazebo
    panes:
      - shell_command:
          - bash -lc 'bash src/cr5a-ces2027/.tmuxp/log-pane.sh gazebo bash -lc "source /opt/ros/humble/setup.bash && source install/setup.bash && exec ros2 launch dobot_gazebo dobot_gazebo.launch.py"'

  - window_name: bridge
    panes:
      - shell_command:
          - bash -lc 'bash src/cr5a-ces2027/.tmuxp/log-pane.sh bridge bash -lc "source /opt/ros/humble/setup.bash && source install/setup.bash && exec ros2 launch cr5a_ros_bridge bridge.launch.py"'

  - window_name: frontend
    panes:
      - shell_command:
          - bash -lc 'bash src/cr5a-ces2027/.tmuxp/log-pane.sh frontend bash -lc "cd cr5a_web && exec pnpm dev"'

  - window_name: monitor
    layout: even-horizontal
    panes:
      - shell_command:
          - bash -lc 'bash src/cr5a-ces2027/.tmuxp/log-pane.sh monitor-nodes bash -lc "source /opt/ros/humble/setup.bash && source install/setup.bash && watch -n 3 ros2 node list"'
      - shell_command:
          - bash -lc 'bash src/cr5a-ces2027/.tmuxp/log-pane.sh monitor-topics bash -lc "source /opt/ros/humble/setup.bash && source install/setup.bash && watch -n 5 ros2 topic list"'

  - window_name: shell
    panes:
      - shell_command:
          - bash -lc 'bash src/cr5a-ces2027/.tmuxp/log-pane.sh shell bash -lc "source /opt/ros/humble/setup.bash && source install/setup.bash && exec bash"'
