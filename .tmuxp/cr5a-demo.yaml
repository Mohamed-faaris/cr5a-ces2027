# CR5A demo stack
# Run from the ROS 2 workspace root inside moveit-dev:
#   tmux set-option -g mouse on
#   tmuxp load src/cr5a-ces2027/.tmuxp/cr5a-demo.yaml
#
# Every operational window has a separate logged, interactive Humble shell pane.
# Window 5 is retained as a full-size workspace shell.
#
# MoveIt's demo launch uses fake ros2_control hardware and starts the Dobot
# telemetry/service simulator. Do not start Gazebo in this ROS domain: its
# separate robot_state_publisher creates a second, unlinked CR5A TF tree.

session_name: cr5a-demo
start_directory: ../../../
windows:
  - window_name: moveit-demo
    focus: true
    layout: even-horizontal
    panes:
      - shell_command:
          - bash -lc 'bash src/cr5a-ces2027/.tmuxp/log-pane.sh moveit-demo bash -lc "source /opt/ros/humble/setup.bash && source install/setup.bash && exec ros2 launch cr5_moveit demo.launch.py"'
      - shell_command:
          - bash -lc 'bash src/cr5a-ces2027/.tmuxp/log-pane.sh shell-moveit-demo bash -lc "source /opt/ros/humble/setup.bash && source install/setup.bash && exec bash -i"'

  # The fake PGEA server is started by cr5_moveit demo.launch.py.
  # This window monitors its action endpoint and provides a ROS shell; do not
  # launch the physical pgea_gripper node in the simulation ROS domain.
  - window_name: gripper
    layout: even-horizontal
    panes:
      - shell_command:
          - bash -lc 'bash src/cr5a-ces2027/.tmuxp/log-pane.sh gripper-monitor bash -lc "source /opt/ros/humble/setup.bash && source install/setup.bash && exec watch -n 3 ros2 action list"'
      - shell_command:
          - bash -lc 'bash src/cr5a-ces2027/.tmuxp/log-pane.sh shell-gripper bash -lc "source /opt/ros/humble/setup.bash && source install/setup.bash && exec bash -i"'

  - window_name: bridge
    layout: even-horizontal
    panes:
      - shell_command:
          - bash -lc 'bash src/cr5a-ces2027/.tmuxp/log-pane.sh bridge bash -lc "source /opt/ros/humble/setup.bash && source install/setup.bash && exec ros2 launch cr5a_ros_bridge bridge.launch.py simulation:=true"'
      - shell_command:
          - bash -lc 'bash src/cr5a-ces2027/.tmuxp/log-pane.sh shell-bridge bash -lc "source /opt/ros/humble/setup.bash && source install/setup.bash && exec bash -i"'

  - window_name: frontend
    layout: even-horizontal
    panes:
      - shell_command:
          - bash -lc 'bash src/cr5a-ces2027/.tmuxp/log-pane.sh frontend bash -lc "cd src/cr5a-ces2027/cr5a_web && exec pnpm dev"'
      - shell_command:
          - bash -lc 'bash src/cr5a-ces2027/.tmuxp/log-pane.sh shell-frontend bash -lc "source /opt/ros/humble/setup.bash && source install/setup.bash && exec bash -i"'

  - window_name: monitor
    layout: tiled
    panes:
      - shell_command:
          - bash -lc 'bash src/cr5a-ces2027/.tmuxp/log-pane.sh monitor-nodes bash -lc "source /opt/ros/humble/setup.bash && source install/setup.bash && watch -n 3 ros2 node list"'
      - shell_command:
          - bash -lc 'bash src/cr5a-ces2027/.tmuxp/log-pane.sh monitor-topics bash -lc "source /opt/ros/humble/setup.bash && source install/setup.bash && watch -n 5 ros2 topic list"'
      - shell_command:
          - bash -lc 'bash src/cr5a-ces2027/.tmuxp/log-pane.sh shell-monitor bash -lc "source /opt/ros/humble/setup.bash && source install/setup.bash && exec bash -i"'

  - window_name: shell
    panes:
      - shell_command:
          - bash -lc 'bash src/cr5a-ces2027/.tmuxp/log-pane.sh shell bash -lc "source /opt/ros/humble/setup.bash && source install/setup.bash && exec bash -i"'
