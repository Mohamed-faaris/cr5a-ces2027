session_name: cr5a-pick-place-gazebo
windows:
  - window_name: gazebo-moveit
    layout: even-horizontal
    panes:
      - shell_command:
          - cd /root/cr5a_ws
          - export ROS_DOMAIN_ID=83
          - source /opt/ros/humble/setup.bash
          - source install/setup.bash
          - ros2 launch dobot_gazebo pick_place_gazebo.launch.py shelf_profile:=standard object_kind:=coke shelf_level:=1 gui:=false gazebo_port:=11346
      - shell_command:
          - cd /root/cr5a_ws
          - export ROS_DOMAIN_ID=83
          - source /opt/ros/humble/setup.bash
          - source install/setup.bash
          - watch -n 2 'ros2 control list_controllers -c /controller_manager 2>/dev/null; echo; ros2 action list 2>/dev/null'
  - window_name: bridge
    panes:
      - shell_command:
          - cd /root/cr5a_ws
          - export ROS_DOMAIN_ID=83
          - source /opt/ros/humble/setup.bash
          - source install/setup.bash
          - ros2 launch cr5a_ros_bridge bridge.launch.py simulation:=true
  - window_name: frontend
    panes:
      - shell_command:
          - cd /root/cr5a_ws/src/cr5a-ces2027/cr5a_web
          - pnpm dev --host 0.0.0.0 --port 5173
  - window_name: monitor
    panes:
      - shell_command:
          - cd /root/cr5a_ws
          - export ROS_DOMAIN_ID=83
          - source /opt/ros/humble/setup.bash
          - source install/setup.bash
          - watch -n 2 'ros2 node list; echo; ros2 service list | grep -E "SetPayload|RobotMode|apply_planning_scene|get_planning_scene|controller_manager"'
  - window_name: shell
    panes:
      - shell_command:
          - cd /root/cr5a_ws
          - export ROS_DOMAIN_ID=83
          - source /opt/ros/humble/setup.bash
          - source install/setup.bash
