# Run from the CR5A ROS 2 workspace root, inside the moveit-dev
# Distrobox (Ubuntu 22.04 / ROS 2 Humble):
#   tmuxp load src/cr5a-ces2027/.tmuxp/cr5a-hardware.yaml
#
# The driver reads IP_address from its environment when provided;
# otherwise it uses dobot_bringup_v4/config/param.json.
#
# Each operational pane has a matching interactive Humble shell pane.
# This profile starts the physical Dobot driver. Do not load it together
# with the demo profile.

session_name: cr5a-hardware
start_directory: ../../../
windows:
  - window_name: hardware
    layout: tiled
    focus: true
    panes:
      - shell_command:
          - bash -lc 'bash src/cr5a-ces2027/.tmuxp/log-pane.sh hardware-driver bash -lc "source /opt/ros/humble/setup.bash && source install/setup.bash && exec ros2 launch dobot_bringup_v4 dobot_bringup_ros2.launch.py"'
      - shell_command:
          - bash -lc 'bash src/cr5a-ces2027/.tmuxp/log-pane.sh shell-hardware-driver bash -lc "source /opt/ros/humble/setup.bash && source install/setup.bash && exec bash -i"'
      - shell_command:
          - bash -lc 'bash src/cr5a-ces2027/.tmuxp/log-pane.sh moveit bash -lc "source /opt/ros/humble/setup.bash && source install/setup.bash && exec ros2 launch cr5_moveit dobot_moveit.launch.py"'
      - shell_command:
          - bash -lc 'bash src/cr5a-ces2027/.tmuxp/log-pane.sh shell-moveit bash -lc "source /opt/ros/humble/setup.bash && source install/setup.bash && exec bash -i"'
      - shell_command:
          - bash -lc 'bash src/cr5a-ces2027/.tmuxp/log-pane.sh bridge bash -lc "source /opt/ros/humble/setup.bash && source install/setup.bash && exec ros2 launch cr5a_ros_bridge bridge.launch.py start_rosbridge:=false"'
      - shell_command:
          - bash -lc 'bash src/cr5a-ces2027/.tmuxp/log-pane.sh shell-bridge bash -lc "source /opt/ros/humble/setup.bash && source install/setup.bash && exec bash -i"'
      - shell_command:
          - bash -lc 'bash src/cr5a-ces2027/.tmuxp/log-pane.sh monitor-nodes bash -lc "source /opt/ros/humble/setup.bash && source install/setup.bash && watch -n 5 ros2 node list"'
      - shell_command:
          - bash -lc 'bash src/cr5a-ces2027/.tmuxp/log-pane.sh shell-monitor bash -lc "source /opt/ros/humble/setup.bash && source install/setup.bash && exec bash -i"'
  - window_name: camera
    layout: even-horizontal
    panes:
      - shell_command:
          - bash -lc 'bash src/cr5a-ces2027/.tmuxp/log-pane.sh d415-camera bash -lc "source /opt/ros/humble/setup.bash && source install/setup.bash && exec ros2 launch realsense2_camera rs_launch.py camera_namespace:=cr5 camera_name:=wrist_camera enable_color:=true enable_depth:=true enable_sync:=true align_depth.enable:=true"'
      - shell_command:
          - bash -lc 'bash src/cr5a-ces2027/.tmuxp/log-pane.sh shell-d415-camera bash -lc "source /opt/ros/humble/setup.bash && source install/setup.bash && exec bash -i"'
  - window_name: gripper
    layout: even-horizontal
    panes:
      - shell_command:
          - bash -lc 'bash src/cr5a-ces2027/.tmuxp/log-pane.sh pgea-gripper bash -lc "source /opt/ros/humble/setup.bash && source install/setup.bash && exec ros2 launch pgea_gripper pgea_gripper.launch.py transport:=bringup"'
      - shell_command:
          - bash -lc 'bash src/cr5a-ces2027/.tmuxp/log-pane.sh shell-pgea-gripper bash -lc "source /opt/ros/humble/setup.bash && source install/setup.bash && exec bash -i"'
