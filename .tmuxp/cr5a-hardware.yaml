# Run from the CR5A ROS 2 workspace root, inside the moveit-dev
# Distrobox (Ubuntu 22.04 / ROS 2 Humble):
#   tmuxp load .tmuxp/cr5a-hardware.yaml
#
# Set IP_address in this shell before loading to override param.json:
#   export IP_address=192.168.1.6
#
# This profile starts the physical Dobot driver. Do not load it together
# with the demo profile.

session_name: cr5a-hardware
start_directory: .
windows:
  - window_name: hardware
    layout: tiled
    focus: true
    panes:
      - shell_command:
          - source /opt/ros/humble/setup.zsh && source install/setup.zsh && ros2 launch dobot_bringup_v4 dobot_bringup_ros2.launch.py
      - shell_command:
          - source /opt/ros/humble/setup.zsh && source install/setup.zsh && ros2 launch cr5_moveit dobot_moveit.launch.py
      - shell_command:
          - source /opt/ros/humble/setup.zsh && source install/setup.zsh && ros2 launch cr5a_ros_bridge bridge.launch.py start_rosbridge:=false
      - shell_command:
          - source /opt/ros/humble/setup.zsh && source install/setup.zsh && watch -n 5 'ros2 node list 2>/dev/null'
