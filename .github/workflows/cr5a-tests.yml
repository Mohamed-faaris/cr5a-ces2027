name: CR5A tests

on:
  workflow_dispatch:
    inputs:
      test:
        description: Run ROS 2 bridge tests
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ros-bridge-tests:
    if: inputs.test == true
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install workspace dependencies
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          sudo apt-get update
          rosdep update
          rosdep install --from-paths . --ignore-src -r -y

      - name: Build bridge and dependencies
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --packages-up-to cr5a_ros_bridge

      - name: Run bridge API tests
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          python3 -m pytest -q cr5a_ros_bridge/test
