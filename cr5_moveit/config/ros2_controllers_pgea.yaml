# Gazebo ros2_control controllers for the custom CR5A + PGEA model.
controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    cr5_group_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_action_controller:
      type: position_controllers/GripperActionController

joint_state_broadcaster:
  ros__parameters:
    # GazeboSystem exposes its mimic state as right_finger_joint_mimic.
    # MoveIt gets the right finger pose from the URDF mimic relation, so
    # publish only the source joint to avoid an unknown joint in /joint_states.
    joints: [joint1, joint2, joint3, joint4, joint5, joint6, left_finger_joint]

cr5_group_controller:
  ros__parameters:
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 0.5
      joint1: {trajectory: 0.08, goal: 0.03}
      joint2: {trajectory: 0.08, goal: 0.03}
      joint3: {trajectory: 0.08, goal: 0.03}
      joint4: {trajectory: 0.08, goal: 0.03}
      joint5: {trajectory: 0.08, goal: 0.03}
      joint6: {trajectory: 0.08, goal: 0.03}

gripper_action_controller:
  ros__parameters:
    joint: left_finger_joint
    action_monitor_rate: 20.0
    goal_tolerance: 0.005
    max_effort: 100.0
